<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07050a">

  <title>valdemar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #07050a;
      color: #cfc9b8;
      font-family: monospace;
    }

    .background {
      position: fixed;
      inset: 0;
      background: #07050a;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .background::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(244, 195, 0, 0.035),
        transparent 50%
        );
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 30%,
        rgba(0, 0, 0, 0.78)
      );
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-7px);
      padding: 24px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      color: #eee;
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow:
        0 0 2px #fff,
        0 0 8px rgba(255, 255, 255, 0.65),
        0 0 12px rgba(255, 255, 255, 0.25);
      transition: 180ms ease;
    }

    nav a::before {
      content: "·";
      margin-right: 8px;
      color: rgba(244, 195, 0, 0.35);
    }

    nav a:hover,
    nav a:focus-visible {
      color: #f4c300;
      text-shadow: 0 0 12px rgba(244, 195, 0, 0.3);
    }

    nav a:hover::before,
    nav a:focus-visible::before {
      color: #f4c300;
    }

    nav a:focus-visible {
      outline: 1px solid #f4c300;
      outline-offset: 8px;
    }

    @media (max-width: 560px) {
      nav {
        flex-direction: column;
        gap: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <canvas id="stars"></canvas>
  </div>

  <main>
    <nav>
      <a href="https://www.instagram.com/iamthevaldemar/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://discord.com/users/1170058017262276668" target="_blank" rel="noopener noreferrer">Discord</a>
      <a href="https://soundcloud.com/iamthevaldemar" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a href="https://www.tiktok.com/@iamthevaldemar" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="https://iamthevaldemar.bandcamp.com/" target="_blank" rel="noopener noreferrer">Bandcamp</a>
    </nav>
  </main>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let w = 0;
    let h = 0;

    function resize() {
      w = innerWidth;
      h = innerHeight;

      const dpr = Math.min(devicePixelRatio || 1, 2);

      canvas.width = w * dpr;
      canvas.height = h * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      stars = [];

      for (let i = 0; i < Math.max(40, Math.floor(w * h / 10000)); i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() < .94 ? 1 : 2,
          opacity: .12 + Math.random() * .52,
          speed: 0.02 + Math.random() * 0.04,
          phase: Math.random() * Math.PI * 2,
          twinkle: 0.002 + Math.random() * 0.003
        });
      }
    }

    function draw(time) {
      ctx.clearRect(0, 0, w, h);

      for (const star of stars) {
        const glow =
          .66 + Math.sin(time * star.twinkle + star.phase) * .28;

        ctx.fillStyle =
          `rgba(200, 192, 170, ${star.opacity * glow})`;

        ctx.fillRect(
          star.x | 0,
          star.y | 0,
          star.size,
          star.size
        );

        star.y += star.speed;

        if (star.y > h) {
          star.y = -star.size;
          star.x = Math.random() * w;
        }
      }

      requestAnimationFrame(draw);
    }

    addEventListener("resize", resize);

    resize();
    requestAnimationFrame(draw);
  </script>

</body>
</html>
