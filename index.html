<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07050a">
  <meta name="description" content="Official links for VALDEMAR: Instagram, Discord, SoundCloud, TikTok, YouTube and Bandcamp.">

  <title>VALDEMAR</title>

  <link rel="canonical" href="https://valdemar-28.github.io/">
  <link rel="icon" type="image/png" href="vlogo_yl_32px.png">

  <meta property="og:title" content="VALDEMAR">
  <meta property="og:description" content="Official links for VALDEMAR.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://valdemar-28.github.io/">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background: #07050a;
      color: #cfc9b8;
      font-family: monospace;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #07050a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .background::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(244, 195, 0, 0.035),
        transparent 50%
      );
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 30%,
        rgba(0, 0, 0, 0.78)
      );
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-7px);
      padding: 24px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    nav a {
      position: relative;
      display: inline-flex;
      align-items: center;
      color: #eee;
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow:
        0 0 2px #fff,
        0 0 8px rgba(255, 255, 255, 0.65),
        0 0 12px rgba(255, 255, 255, 0.25);
      transition:
        color 180ms ease,
        text-shadow 180ms ease;
    }

    nav a::before {
      content: "·";
      margin-right: 8px;
      color: rgba(244, 195, 0, 0.35);
    }

    nav a::after {
      content: "";
      position: absolute;
      inset: -8px -6px;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #f4c300;
      text-shadow: 0 0 12px rgba(244, 195, 0, 0.3);
    }

    nav a:hover::before,
    nav a:focus-visible::before {
      color: #f4c300;
    }

    nav a:focus-visible {
      outline: 1px solid #f4c300;
      outline-offset: 8px;
    }

    @media (max-width: 560px) {
      nav {
        flex-direction: column;
        gap: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="background" aria-hidden="true">
    <canvas id="stars"></canvas>
  </div>

  <main aria-label="VALDEMAR">
    <nav aria-label="Social links">
      <a href="https://www.instagram.com/iamthevaldemar/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://discord.com/users/1170058017262276668" target="_blank" rel="noopener noreferrer">Discord</a>
      <a href="https://soundcloud.com/iamthevaldemar" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a href="https://www.tiktok.com/@iamthevaldemar" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="https://www.youtube.com/@iamthevaldemar" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://iamthevaldemar.bandcamp.com/" target="_blank" rel="noopener noreferrer">Bandcamp</a>
    </nav>
  </main>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let stars = [];
    let w = 0;
    let h = 0;
    let frame = 0;

    function resize() {
      w = innerWidth;
      h = innerHeight;

      const dpr = Math.min(devicePixelRatio || 1, 2);

      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      stars = [];

      for (let i = 0; i < Math.max(40, Math.floor(w * h / 10000)); i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() < .94 ? 1 : 2,
          opacity: .12 + Math.random() * .52,
          speed: .02 + Math.random() * .04,
          phase: Math.random() * Math.PI * 2,
          twinkle: .002 + Math.random() * .003
        });
      }
    }

    function paint(time, move) {
      ctx.clearRect(0, 0, w, h);

      for (const star of stars) {
        const glow = .66 + Math.sin(time * star.twinkle + star.phase) * .28;

        ctx.fillStyle = `rgba(200, 192, 170, ${star.opacity * glow})`;

        ctx.fillRect(
          star.x | 0,
          star.y | 0,
          star.size,
          star.size
        );

        if (!move) continue;

        star.y += star.speed;

        if (star.y > h) {
          star.y = -star.size;
          star.x = Math.random() * w;
        }
      }
    }

    function animate(time) {
      paint(time, true);
      frame = requestAnimationFrame(animate);
    }

    function syncAnimation() {
      cancelAnimationFrame(frame);
      frame = 0;

      if (document.hidden) return;

      if (reduceMotion.matches) {
        paint(0, false);
        return;
      }

      frame = requestAnimationFrame(animate);
    }

    addEventListener("resize", resize);
    document.addEventListener("visibilitychange", syncAnimation);
    reduceMotion.addEventListener("change", syncAnimation);

    resize();
    syncAnimation();
  </script>

</body>
</html>
